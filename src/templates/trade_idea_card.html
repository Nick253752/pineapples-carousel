
        <div style="display:flex;flex-direction:column;background:#ffffff;border:2px solid #e6dcc4;border-radius:18px;padding:30px 32px;margin-bottom:24px;">
          <div style="display:flex;justify-content:space-between;align-items:center;">
            <div style="font-family:'Bitter',serif;font-weight:700;font-size:40px;color:#1F3D2B;" data-field="ideas[{{i}}].ticker">{{ticker}}</div>
            <div style="font-family:'Karla',sans-serif;font-weight:800;font-size:24px;color:#ffffff;background:{{dir_color}};padding:9px 24px;border-radius:22px;text-transform:uppercase;letter-spacing:0.04em;" data-field="ideas[{{i}}].dir">{{dir}}</div>
          </div>
          <div style="display:flex;gap:26px;margin-top:20px;font-family:'Karla',sans-serif;font-size:22px;color:#6b6459;flex-wrap:wrap;">
            <div data-field="ideas[{{i}}].entry"><span style="color:#a89b7f;">Entry</span><br><span style="font-weight:700;color:#1F3D2B;font-size:29px;">{{entry}}</span></div>
            <div data-field="ideas[{{i}}].stop"><span style="color:#a89b7f;">Stop</span><br><span style="font-weight:700;color:#9c4620;font-size:29px;">{{stop}}</span></div>
            <div data-field="ideas[{{i}}].target"><span style="color:#a89b7f;">Target</span><br><span style="font-weight:700;color:#1F3D2B;font-size:29px;">{{target}}</span></div>
            <div data-field="ideas[{{i}}].rr"><span style="color:#a89b7f;">RR</span><br><span style="font-weight:700;color:#1F3D2B;font-size:29px;">{{rr}}</span></div>
            <div data-field="ideas[{{i}}].conf"><span style="color:#a89b7f;">Conf.</span><br><span style="font-weight:700;color:#B9791C;font-size:29px;">{{conf}}</span></div>
          </div>
          {{flyer_badge}}
        </div>
